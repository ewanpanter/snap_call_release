# LEGACY (Vertex path; the burst runner doesn't use it).
# Heavy base image (CUDA, torch, transformers, PEFT). Built rarely; experiment images add a
# thin code layer on top. Experiment tier.
name: base-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/Dockerfile.base"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: base-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      # Pushed to the snapcall repo in every Vertex region, so jobs pull locally.
      REGIONS: ${{ vars.VERTEX_REGIONS || vars.GCP_REGION }}
    steps:
      - name: free runner disk (CUDA images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EXPERIMENT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: build and push to every region
        run: |
          TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          docker build -f docker/Dockerfile.base -t base:build .
          for r in $REGIONS; do
            [[ "$r" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || { echo "bad region in VERTEX_REGIONS: $r"; exit 1; }
            AR="$r-docker.pkg.dev/$PROJECT/snapcall"
            gcloud auth configure-docker "$r-docker.pkg.dev" --quiet
            for t in "$TAG" latest; do
              docker tag base:build "$AR/base:$t"
              docker push "$AR/base:$t"
            done
          done
